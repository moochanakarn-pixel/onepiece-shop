<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Card Shop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#fff;--border:#e5e3dc;--border2:#d0cdc4;
  --text:#1a1a1a;--muted:#6b6862;--hint:#9b9890;
  --green:#0F6E56;--green-bg:#E1F5EE;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-bd:#B5D4F4;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --red:#993C1D;--red-bg:#FAECE7;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
.layout{max-width:800px;margin:0 auto;padding:1rem}
.header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.logo{width:42px;height:42px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px}
.header h1{font-size:18px;font-weight:600}
.header p{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:2px;margin-bottom:1.5rem;border-bottom:1px solid var(--border)}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.stat-value{font-size:20px;font-weight:600}
.profit{color:var(--green)}.loss{color:var(--red)}
.card-list{display:flex;flex-direction:column;gap:8px}
.card-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:start;gap:10px}
.card-body{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:500;line-height:1.4}
.card-meta{font-size:12px;color:var(--muted);margin-top:3px}
.card-market{font-size:11px;color:var(--amber);font-weight:500;margin-top:3px}
.card-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:500;white-space:nowrap}
.b-stock{background:var(--green-bg);color:var(--green)}
.b-r{background:var(--blue-bg);color:var(--blue)}
.b-sr{background:var(--purple-bg);color:var(--purple)}
.b-sec,.b-l{background:var(--amber-bg);color:var(--amber)}
.btn-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;font-size:12px;border:1px solid var(--border2);border-radius:var(--radius);background:none;cursor:pointer;color:var(--muted);transition:background .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--text);color:#fff;border-color:transparent}
.btn-primary:hover{background:#333}
.btn-c2p{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd);font-weight:500}
.btn-c2p:hover{background:var(--blue-bd)}
.btn-danger{color:var(--red);border-color:#F5C4B3}
.btn-danger:hover{background:var(--red-bg)}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1.5rem}
.form-title{font-size:14px;font-weight:600;margin-bottom:1rem;color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{height:36px;padding:0 10px;border:1px solid var(--border2);border-radius:var(--radius);background:#fff;color:var(--text);font-size:13px;font-family:inherit}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.field-hint{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:var(--radius);padding:8px 12px;grid-column:1/-1}
.field-hint label{color:var(--blue);font-size:11px;font-weight:600;margin-bottom:5px;display:block}
.field-hint .inner{display:flex;gap:8px;align-items:center}
.field-hint .inner input{flex:1;border-color:var(--blue-bd)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.sell-row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sell-row:last-child{border:none}
.sell-info{flex:1;min-width:160px}
.sell-name{font-size:13px;font-weight:500}
.sell-meta{font-size:12px;color:var(--muted)}
.sell-inputs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sell-input{width:90px;height:32px;padding:0 8px;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);background:#fff;color:var(--text)}
.msg{font-size:13px;padding:8px 12px;border-radius:var(--radius);margin-top:.75rem}
.msg-ok{background:var(--green-bg);color:var(--green)}
.msg-err{background:var(--red-bg);color:var(--red)}
.history-item{display:flex;align-items:start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border:none}
.h-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.h-buy{background:var(--blue)}.h-sell{background:var(--green)}
.h-body{flex:1}
.h-name{font-size:13px;font-weight:500}
.h-detail{font-size:12px;color:var(--muted);margin-top:2px}
.h-amt{font-size:13px;font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:2.5rem;color:var(--hint);font-size:13px}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.section-title{font-size:14px;font-weight:600}
.banner{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:var(--radius);padding:9px 14px;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px}
.banner p{font-size:12px;color:var(--blue);flex:1;line-height:1.5}
.search-box{width:100%;height:36px;padding:0 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;margin-bottom:1rem;font-family:inherit}
.search-box:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
#loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--blue);animation:slide .6s ease-out forwards}
@keyframes slide{from{width:0}to{width:100%}}
@media(max-width:560px){
  .form-grid{grid-template-columns:1fr}
  .form-full{grid-column:1}
  .stats-grid{grid-template-columns:1fr 1fr}
  .field-hint{grid-column:1}
}
</style>
</head>
<body>
<div class="layout">
  <div class="header">
    <div class="logo">🏴‍☠️</div>
    <div>
      <h1>One Piece Card Shop</h1>
      <p id="hdr-sub">ระบบจัดการสต็อก · ต้นทุน · กำไร</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('dashboard')">📊 ภาพรวม</button>
    <button class="tab" onclick="setTab('stock')">📦 สต็อก</button>
    <button class="tab" onclick="setTab('buy')">➕ ซื้อเข้า</button>
    <button class="tab" onclick="setTab('sell')">🏷️ ขายออก</button>
    <button class="tab" onclick="setTab('history')">📋 ประวัติ</button>
  </div>

  <div id="tab-dashboard"></div>
  <div id="tab-stock"    style="display:none"></div>
  <div id="tab-buy"      style="display:none"></div>
  <div id="tab-sell"     style="display:none"></div>
  <div id="tab-history"  style="display:none"></div>
</div>

<script>
const API = 'api/index.php?path=';
let activeTab = 'dashboard';

// ─── UTILS ────────────────────────────────────────────────────────────────────
const fmt  = n => '฿' + Number(n).toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:0});
const pct  = (a,b) => b > 0 ? ((a-b)/b*100).toFixed(1)+'%' : '—';

function c2pUrl(cardNo) {
  return cardNo ? `https://card2price.com/card/${encodeURIComponent(cardNo.trim())}` : 'https://card2price.com/cards';
}

function rarityBadge(r) {
  const map = {R:'b-r',SR:'b-sr',SEC:'b-sec',L:'b-l'};
  return (r && map[r]) ? `<span class="badge ${map[r]}" style="margin-left:5px">${r}</span>` : '';
}

async function api(path, method='GET', body=null) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  return res.json();
}

function showMsg(elId, text, ok=true) {
  const el = document.getElementById(elId);
  if (el) { el.className = 'msg ' + (ok?'msg-ok':'msg-err'); el.textContent = text; }
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['dashboard','stock','buy','sell','history'][i] === t);
  });
  ['dashboard','stock','buy','sell','history'].forEach(id => {
    document.getElementById('tab-'+id).style.display = id===t ? '' : 'none';
  });
  render();
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
async function renderDashboard() {
  const [stats, cards] = await Promise.all([api('stats'), api('cards')]);
  const el = document.getElementById('tab-dashboard');

  const unr = stats.unrealized || 0;
  const topCards = (cards||[]).slice(0,5);

  el.innerHTML = `
  <div class="banner">
    <span>🔗</span>
    <p>ราคาตลาดอ้างอิงจาก <strong>card2price.com</strong> — กดปุ่มเช็คราคาที่การ์ดเพื่อดูราคาล่าสุด แล้วกดอัปเดตได้เลย</p>
    <button class="btn btn-c2p" onclick="window.open('https://card2price.com/cards','_blank')">เปิดเว็บ ↗</button>
  </div>
  <div class="stats-grid">
    <div class="stat"><div class="stat-label">ต้นทุนรวม</div><div class="stat-value">${fmt(stats.total_cost)}</div></div>
    <div class="stat"><div class="stat-label">รายรับรวม</div><div class="stat-value">${fmt(stats.total_revenue)}</div></div>
    <div class="stat"><div class="stat-label">กำไรที่ขายแล้ว</div><div class="stat-value ${stats.total_profit>=0?'profit':'loss'}">${fmt(stats.total_profit)}</div></div>
    <div class="stat"><div class="stat-label">กำไรยังไม่รับ</div><div class="stat-value ${unr>=0?'profit':'loss'}">${fmt(unr)}</div></div>
    <div class="stat"><div class="stat-label">มูลค่าสต็อก (ทุน)</div><div class="stat-value">${fmt(stats.stock_value)}</div></div>
    <div class="stat"><div class="stat-label">มูลค่าสต็อก (ตลาด)</div><div class="stat-value">${fmt(stats.market_value)}</div></div>
    <div class="stat"><div class="stat-label">ซื้อมาทั้งหมด</div><div class="stat-value">${stats.total_bought} ใบ</div></div>
    <div class="stat"><div class="stat-label">สต็อกคงเหลือ</div><div class="stat-value">${stats.stock_count} ใบ</div></div>
  </div>
  <div class="section-hd"><span class="section-title">การ์ดมูลค่าสูงสุดในสต็อก</span></div>
  <div class="card-list">
  ${topCards.length ? topCards.map(c => cardItemHtml(c)).join('') : '<div class="empty">ยังไม่มีสต็อก</div>'}
  </div>`;
}

function cardItemHtml(c, showSell=false) {
  const marketLine = c.market_price > 0
    ? `<div class="card-market">📈 ราคาตลาด ${fmt(c.market_price)} · กำไร ${fmt(c.market_price - c.cost)}/ใบ</div>`
    : `<div class="card-market" style="color:var(--hint)">ยังไม่มีราคาตลาด — กดเช็คราคาเพื่ออัปเดต</div>`;

  return `
  <div class="card-item" id="ci-${c.id}">
    <div class="card-body">
      <div class="card-name">${c.name}${rarityBadge(c.rarity)}</div>
      <div class="card-meta">${c.card_set||''}${c.card_no?' · '+c.card_no:''} · ต้นทุน ${fmt(c.cost)} · เหลือ ${c.qty} ใบ</div>
      ${marketLine}
    </div>
    <div class="card-actions">
      <span class="badge b-stock">${c.qty} ใบ</span>
      <div class="btn-row">
        <button class="btn btn-c2p" onclick="window.open('${c2pUrl(c.card_no)}','_blank')">เช็คราคา ↗</button>
        <button class="btn" onclick="promptMarket(${c.id},'${c.name.replace(/'/g,"\\'")}',${c.market_price||0})">฿ อัปเดต</button>
        ${!showSell ? `<button class="btn btn-danger" onclick="deleteCard(${c.id})">✕</button>` : ''}
      </div>
    </div>
  </div>`;
}

// ─── STOCK ────────────────────────────────────────────────────────────────────
async function renderStock() {
  const el = document.getElementById('tab-stock');
  el.innerHTML = `<input class="search-box" placeholder="ค้นหาการ์ด ชื่อ หรือ เลขการ์ด..." oninput="searchCards(this.value)">
    <div class="section-hd"><span class="section-title" id="stock-count">กำลังโหลด...</span></div>
    <div class="card-list" id="stock-list"><div class="empty">กำลังโหลด...</div></div>`;
  loadStock('');
}

async function loadStock(q) {
  const cards = await api('cards' + (q ? `&q=${encodeURIComponent(q)}` : ''));
  document.getElementById('stock-count').textContent = `สต็อกทั้งหมด (${(cards||[]).length} รายการ)`;
  document.getElementById('stock-list').innerHTML =
    cards && cards.length ? cards.map(c => cardItemHtml(c)).join('') : '<div class="empty">ไม่พบการ์ด</div>';
}

let searchTimer;
function searchCards(q) { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadStock(q), 300); }

async function promptMarket(id, name, current) {
  const val = prompt(`ราคาตลาด "${name}" จาก card2price (฿)`, current || '');
  if (val === null) return;
  const price = parseFloat(val) || 0;
  await api(`cards/${id}`, 'PUT', { market_price: price });
  render();
}

async function deleteCard(id) {
  if (!confirm('ลบการ์ดนี้ออกจากสต็อก?')) return;
  await api(`cards/${id}`, 'DELETE');
  render();
}

// ─── BUY ──────────────────────────────────────────────────────────────────────
function renderBuy() {
  document.getElementById('tab-buy').innerHTML = `
  <div class="form-section">
    <div class="form-title">➕ บันทึกการซื้อการ์ด</div>
    <div class="form-grid">
      <div class="field form-full">
        <label>ชื่อการ์ด (ญี่ปุ่น/ไทย)</label>
        <input id="b-name" type="text" placeholder="เช่น ロロノア・ゾロ หรือ Zoro">
      </div>
      <div class="field">
        <label>เซต / ภาค</label>
        <input id="b-set" type="text" placeholder="OP-01, ST-01 ...">
      </div>
      <div class="field">
        <label>เลขการ์ด</label>
        <input id="b-no" type="text" placeholder="OP01-001">
      </div>
      <div class="field">
        <label>ความหายาก</label>
        <select id="b-rarity">
          <option value="">—</option>
          <option>C</option><option>UC</option><option>R</option>
          <option>SR</option><option>SEC</option><option>L</option>
        </select>
      </div>
      <div class="field">
        <label>ต้นทุนต่อใบ (฿)</label>
        <input id="b-cost" type="number" min="0" placeholder="0">
      </div>
      <div class="field">
        <label>จำนวน (ใบ)</label>
        <input id="b-qty" type="number" min="1" value="1">
      </div>
      <div class="field-hint">
        <label>📌 ราคาตลาด card2price.com (฿) — ใส่หลังเปิดเว็บเช็คแล้ว</label>
        <div class="inner">
          <input id="b-market" type="number" min="0" placeholder="ไม่บังคับ">
          <button class="btn btn-c2p" onclick="openC2PBuy()">เช็คก่อน ↗</button>
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="submitBuy()">✓ บันทึก</button>
    </div>
  </div>
  <div id="buy-msg"></div>`;
}

function openC2PBuy() {
  const no = document.getElementById('b-no').value.trim();
  window.open(c2pUrl(no), '_blank');
}

async function submitBuy() {
  const name   = document.getElementById('b-name').value.trim();
  const set    = document.getElementById('b-set').value.trim();
  const cardNo = document.getElementById('b-no').value.trim();
  const rarity = document.getElementById('b-rarity').value;
  const cost   = parseFloat(document.getElementById('b-cost').value) || 0;
  const qty    = parseInt(document.getElementById('b-qty').value) || 1;
  const market = parseFloat(document.getElementById('b-market').value) || 0;

  if (!name) { showMsg('buy-msg', 'กรุณาใส่ชื่อการ์ด', false); return; }

  const res = await api('cards', 'POST', { name, card_set:set, card_no:cardNo, rarity, cost, qty, market_price:market });
  if (res.success) {
    showMsg('buy-msg', `✓ บันทึก ${name} จำนวน ${qty} ใบ (ต้นทุน ${fmt(cost)}) เรียบร้อย`);
    ['b-name','b-cost','b-market'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('b-qty').value = '1';
  } else {
    showMsg('buy-msg', res.error || 'เกิดข้อผิดพลาด', false);
  }
}

// ─── SELL ─────────────────────────────────────────────────────────────────────
async function renderSell() {
  const cards = await api('cards');
  const el = document.getElementById('tab-sell');

  el.innerHTML = `
  <div class="section-hd"><span class="section-title">เลือกการ์ดที่ต้องการขาย</span></div>
  <div id="sell-list">
  ${cards && cards.length ? cards.map(c => `
    <div class="sell-row">
      <div class="sell-info">
        <div class="sell-name">${c.name}${rarityBadge(c.rarity)}</div>
        <div class="sell-meta">ต้นทุน ${fmt(c.cost)} · เหลือ ${c.qty} ใบ${c.market_price>0?' · ตลาด '+fmt(c.market_price):''}</div>
      </div>
      <div class="sell-inputs">
        <button class="btn btn-c2p" style="font-size:11px;padding:4px 8px" onclick="window.open('${c2pUrl(c.card_no)}','_blank')">เช็คราคา ↗</button>
        <input class="sell-input" type="number" placeholder="ราคาขาย (฿)" id="sp-${c.id}"
          value="${c.market_price > 0 ? c.market_price : ''}">
        <input class="sell-input" type="number" placeholder="จำนวน" value="1" min="1" max="${c.qty}" id="sq-${c.id}">
        <button class="btn btn-primary" onclick="submitSell(${c.id})">ขาย</button>
      </div>
    </div>`).join('') : '<div class="empty">ไม่มีสต็อก</div>'}
  </div>
  <div id="sell-msg"></div>`;
}

async function submitSell(id) {
  const price = parseFloat(document.getElementById('sp-'+id).value) || 0;
  const qty   = parseInt(document.getElementById('sq-'+id).value) || 1;

  if (!price) { showMsg('sell-msg', 'กรุณาใส่ราคาขาย', false); return; }

  const res = await api('transactions', 'POST', { card_id:id, price, qty });
  if (res.success) {
    const p = res.profit;
    showMsg('sell-msg', `✓ ขาย ${qty} ใบ ที่ ${fmt(price)} · ${p>=0?'กำไร':'ขาดทุน'} ${fmt(Math.abs(p))}`);
    renderSell();
  } else {
    showMsg('sell-msg', res.error || 'เกิดข้อผิดพลาด', false);
  }
}

// ─── HISTORY ──────────────────────────────────────────────────────────────────
async function renderHistory() {
  const txns = await api('transactions?limit=100');
  const el = document.getElementById('tab-history');

  el.innerHTML = `
  <div class="section-hd"><span class="section-title">ประวัติธุรกรรมล่าสุด</span></div>
  ${txns && txns.length ? txns.map(t => {
    const isBuy = t.type === 'buy';
    const total = (t.price * t.qty).toFixed(0);
    const dateStr = t.created_at ? t.created_at.slice(0,10) : '';
    const profitStr = !isBuy && t.profit != null
      ? ` · ${parseFloat(t.profit)>=0?'กำไร':'ขาดทุน'} ${fmt(Math.abs(t.profit))}` : '';
    return `
    <div class="history-item">
      <div class="h-dot ${isBuy?'h-buy':'h-sell'}"></div>
      <div class="h-body">
        <div class="h-name">${t.card_name}</div>
        <div class="h-detail">${isBuy?'ซื้อเข้า':'ขายออก'} ${t.qty} ใบ · ${fmt(t.price)}/ใบ${profitStr} · ${dateStr}</div>
      </div>
      <div class="h-amt" style="color:${isBuy?'var(--blue)':'var(--green)'}">${isBuy?'−':'+'} ${fmt(total)}</div>
    </div>`;
  }).join('') : '<div class="empty">ยังไม่มีธุรกรรม</div>'}`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  if (activeTab === 'dashboard') renderDashboard();
  else if (activeTab === 'stock') renderStock();
  else if (activeTab === 'buy')   renderBuy();
  else if (activeTab === 'sell')  renderSell();
  else if (activeTab === 'history') renderHistory();
}

render();
</script>
</body>
</html>
