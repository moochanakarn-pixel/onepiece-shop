<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสต็อกสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css?v=6">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyStock">
<link rel="apple-touch-icon" href="assets/img/icon.svg">
</head>
<body>
<div class="layout">
  <div class="header">
    <div class="logo">📦</div>
    <div style="flex:1">
      <h1>ระบบสต็อกสินค้า</h1>
    </div>
    <button class="btn btn-icon" id="refresh-btn" onclick="refreshTab()" title="รีเฟรช">↻</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('dashboard')">📊 ภาพรวม</button>
    <button class="tab" onclick="setTab('stock')">📦 สต็อก</button>
    <button class="tab" onclick="setTab('buy')">➕ ซื้อเข้า</button>
    <button class="tab" onclick="setTab('sell')">🏷️ ขายออก</button>
    <button class="tab" onclick="setTab('history')">📋 ประวัติ</button>
  </div>

  <div id="tab-dashboard"></div>
  <div id="tab-stock"   style="display:none"></div>
  <div id="tab-buy"     style="display:none"></div>
  <div id="tab-sell"    style="display:none"></div>
  <div id="tab-history" style="display:none"></div>
</div>

<!-- toast notification -->
<div id="toast"></div>

<!-- custom modal (confirm / prompt / edit) -->
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="modalBgClick(event)">
  <div class="modal-box" id="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-msg"   id="modal-msg"></div>
    <div id="modal-form"     style="display:none"></div>
    <input class="modal-input" id="modal-input" type="number" inputmode="decimal"
           placeholder="0" style="display:none" onkeydown="if(event.key==='Enter')modalOk()">
    <div class="modal-btns">
      <button class="btn" onclick="modalCancel()">ยกเลิก</button>
      <button class="btn btn-primary" id="modal-ok-btn" onclick="modalOk()">ตกลง</button>
    </div>
  </div>
</div>

<!-- bottom nav (mobile) -->
<nav class="bottom-nav">
  <button class="bnav-btn active" onclick="setTab('dashboard')">
    <span class="bnav-icon">📊</span><span class="bnav-label">ภาพรวม</span>
  </button>
  <button class="bnav-btn" onclick="setTab('stock')">
    <span class="bnav-icon">📦</span><span class="bnav-label">สต็อก</span>
  </button>
  <button class="bnav-btn" onclick="setTab('buy')">
    <span class="bnav-icon">➕</span><span class="bnav-label">ซื้อเข้า</span>
  </button>
  <button class="bnav-btn" onclick="setTab('sell')">
    <span class="bnav-icon">🏷️</span><span class="bnav-label">ขาย</span>
  </button>
  <button class="bnav-btn" onclick="setTab('history')">
    <span class="bnav-icon">📋</span><span class="bnav-label">ประวัติ</span>
  </button>
</nav>

<script src="assets/js/app.js?v=16"></script>
</body>
</html>
